<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Heroes</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #1a202c;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        height: 100%;
        height: 100dvh;
      }
      .adventure-screen {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100%;
        height: 100dvh;
      }
      .adventure-main {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .canvas-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      .canvas-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* the gesture FSM owns all touch input: no browser pan/zoom */
        touch-action: none;
      }
      .sidebar {
        width: 280px;
        padding: 8px;
        box-sizing: border-box;
        background: #2d3748;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .game-title {
        font-size: 18px;
        font-weight: 700;
        text-align: center;
      }
      .minimap {
        align-self: center;
        border: 1px solid #4a5568;
        cursor: pointer;
      }
      .date-indicator {
        font-size: 13px;
        text-align: center;
        color: #cbd5e0;
      }
      .hero-list,
      .town-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .hero-item,
      .town-item,
      .hud-button {
        background: #4a5568;
        color: #e2e8f0;
        border: 1px solid #718096;
        border-radius: 4px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      .hero-item.selected {
        border-color: #ecc94b;
        background: #553c1c;
      }
      .hud-buttons {
        display: flex;
        gap: 8px;
      }
      .hud-button {
        flex: 1;
        text-align: center;
      }
      .hero-panel {
        background: #1a202c;
        border-radius: 4px;
        padding: 8px;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .status-line {
        font-size: 12px;
        color: #a0aec0;
        min-height: 16px;
      }
      .bottom-bar {
        height: 40px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
        background: #2d3748;
        border-top: 1px solid #4a5568;
        font-size: 13px;
      }
      .info-popup {
        position: absolute;
        background: #f7e8c4;
        color: #2d3748;
        border: 1px solid #b7791f;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 13px;
        max-width: 280px;
        pointer-events: none;
        z-index: 10;
      }
      .modal-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        z-index: 40;
      }
      .modal-box {
        background: #f7e8c4;
        color: #2d3748;
        border: 2px solid #b7791f;
        border-radius: 6px;
        padding: 16px 20px;
        box-sizing: border-box;
        max-width: min(420px, calc(100vw - 16px));
        max-height: calc(100dvh - 16px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal-button {
        background: #2d3748;
        color: #e2e8f0;
        border: none;
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
      }
      /* town / hero overlay panels */
      .panel-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 30;
      }
      .panel {
        background: #2d3748;
        border: 2px solid #b7791f;
        border-radius: 8px;
        padding: 14px 18px;
        box-sizing: border-box;
        width: min(960px, calc(100vw - 16px));
        max-height: min(740px, calc(100dvh - 16px));
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-title {
        font-size: 17px;
        font-weight: 700;
      }
      .panel-section {
        background: #1a202c;
        border-radius: 6px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .section-title {
        font-weight: 600;
        color: #ecc94b;
        font-size: 13px;
      }
      .panel-status {
        min-height: 16px;
        font-size: 12px;
        color: #fc8181;
      }
      .ui-button {
        background: #4a5568;
        color: #e2e8f0;
        border: 1px solid #718096;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      .ui-button:hover {
        background: #5a6678;
      }
      .building-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .building-card {
        text-align: left;
        border-radius: 4px;
        border: 1px solid #4a5568;
        padding: 6px 8px;
        background: #2d3748;
        color: #e2e8f0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .building-card .building-name {
        font-weight: 600;
        font-size: 12px;
      }
      .building-card .building-info {
        font-size: 11px;
        color: #a0aec0;
      }
      .building-card.built {
        border-color: #48bb78;
        background: #1f3a2c;
        cursor: default;
      }
      .building-card.available {
        border-color: #ecc94b;
      }
      .building-card.locked,
      .building-card.unaffordable {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .army-row-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .army-row-label {
        width: 90px;
        font-size: 12px;
        color: #a0aec0;
      }
      .army-row {
        display: flex;
        gap: 4px;
      }
      .army-slot {
        width: 96px;
        height: 40px;
        background: #2d3748;
        color: #e2e8f0;
        border: 1px solid #4a5568;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
      }
      .army-slot.selected {
        border-color: #ecc94b;
        background: #553c1c;
      }
      .recruit-row,
      .trade-row,
      .backpack-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hero-columns {
        display: flex;
        gap: 12px;
      }
      .hero-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        font-size: 12px;
      }
      .doll-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .doll-cell {
        height: 32px;
        border: 1px dashed #4a5568;
        border-radius: 4px;
        background: #2d3748;
        color: #718096;
        font-size: 10px;
        cursor: pointer;
      }
      .doll-cell.filled {
        border-style: solid;
        border-color: #ecc94b;
        color: #e2e8f0;
      }
      .count-dialog-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        z-index: 35;
      }
      .count-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .count-input {
        width: 64px;
      }
      .count-buttons {
        display: flex;
        gap: 8px;
      }
      .count-detail {
        font-size: 12px;
        min-height: 14px;
      }
      .trade-select {
        background: #2d3748;
        color: #e2e8f0;
        border: 1px solid #4a5568;
        border-radius: 4px;
        padding: 3px 6px;
      }
      .guild-spell,
      .skill-item {
        font-size: 12px;
      }
      /* combat screen */
      .combat-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 36;
      }
      .combat-panel {
        background: #2d3748;
        border: 2px solid #b7791f;
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .combat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .combat-hero-panel {
        border: 2px solid #718096;
        border-radius: 4px;
        padding: 4px 10px;
        background: #1a202c;
        min-width: 220px;
      }
      .combat-round {
        font-weight: 700;
        color: #ecc94b;
      }
      .combat-canvas-wrap {
        position: relative;
      }
      .combat-canvas {
        display: block;
        border-radius: 4px;
      }
      .combat-bottom {
        display: flex;
        gap: 10px;
        align-items: stretch;
      }
      .combat-log {
        flex: 1;
        height: 96px;
        overflow-y: auto;
        background: #1a202c;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        color: #cbd5e0;
      }
      .combat-side {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 220px;
      }
      .combat-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .combat-status {
        font-size: 12px;
        color: #fc8181;
        min-height: 16px;
      }
      .combat-stacks {
        display: none;
      }
      .spellbook-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 38;
      }
      .spellbook-box {
        background: #2d3748;
        border: 2px solid #b7791f;
        border-radius: 6px;
        padding: 12px 16px;
        box-sizing: border-box;
        width: min(460px, calc(100vw - 16px));
        max-height: min(540px, calc(100dvh - 16px));
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .spellbook-filters {
        display: flex;
        gap: 8px;
      }
      .spellbook-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .spellbook-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #1a202c;
        border-radius: 4px;
        padding: 6px 8px;
      }
      .spellbook-name {
        font-weight: 600;
        font-size: 12px;
      }
      .spellbook-desc {
        font-size: 11px;
        color: #a0aec0;
      }
      /* shell: main menu, new-game setup, pass-device / game-over overlays */
      .menu-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100%;
        height: 100dvh;
      }
      .menu-box {
        background: #2d3748;
        border: 2px solid #b7791f;
        border-radius: 8px;
        padding: 24px 32px;
        box-sizing: border-box;
        min-width: min(420px, calc(100vw - 24px));
        max-width: min(720px, calc(100vw - 24px));
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .menu-title {
        display: block;
        width: 100%;
        max-width: min(480px, 100%);
        margin: 0 auto;
        border-radius: 6px;
      }
      .menu-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .menu-buttons-column {
        flex-direction: column;
      }
      .menu-button {
        background: #4a5568;
        color: #e2e8f0;
        border: 1px solid #718096;
        border-radius: 4px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 15px;
      }
      .menu-button:hover:not(:disabled) {
        background: #5a6678;
      }
      .menu-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .menu-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .menu-section-title {
        font-weight: 600;
        color: #ecc94b;
        font-size: 13px;
      }
      .map-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .map-option {
        background: #1a202c;
        color: #e2e8f0;
        border: 1px solid #4a5568;
        border-radius: 4px;
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
        font-size: 13px;
      }
      .map-option.selected {
        border-color: #ecc94b;
        background: #553c1c;
      }
      .setup-options {
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 13px;
      }
      .player-rows {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .player-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .player-color {
        width: 60px;
        font-weight: 600;
      }
      .player-control {
        width: 60px;
        color: #a0aec0;
      }
      .menu-load-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .slot-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .slot-label {
        flex: 1;
      }
      .slot-button {
        padding: 4px 12px;
        font-size: 13px;
      }
      .pass-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a202c;
        z-index: 60;
      }
      .game-over-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(26, 32, 44, 0.85);
        z-index: 70;
      }
      .system-panel-box {
        width: min(560px, calc(100vw - 16px));
      }
      .import-input {
        font-size: 12px;
        color: #a0aec0;
      }
      /* narrow screens: overlays stack/wrap so everything fits a 390px portrait phone */
      @media (max-width: 768px) {
        .menu-box {
          padding: 12px;
        }
        .setup-options {
          flex-wrap: wrap;
          gap: 10px;
        }
        .hero-columns {
          flex-direction: column;
        }
        .building-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .army-row-wrap,
        .army-row,
        .recruit-row,
        .trade-row,
        .backpack-row {
          flex-wrap: wrap;
        }
        .count-row {
          flex-wrap: wrap;
        }
        .count-slider {
          flex: 1 1 100%;
          min-height: 28px;
        }
        .count-input {
          min-height: 28px;
          box-sizing: border-box;
        }
        .count-buttons .ui-button {
          padding: 8px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
